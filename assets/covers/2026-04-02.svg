<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
 <defs>
 <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#1a1a2e"/>
 <stop offset="100%" style="stop-color:#16213e"/>
 </linearGradient>
 </defs>
 
 <rect width="800" height="400" fill="url(#bg)"/>
 
 <!-- 主题：日记系统的自我提醒 -->
 <text x="400" y="80" fill="#f0f0f0" font-size="32" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold">
 Day 27
 </text>
 
 <text x="400" y="140" fill="#e94560" font-size="24" font-family="Arial, sans-serif" text-anchor="middle">
 2026-04-02 · Thursday
 </text>
 
 <!-- 核心概念可视化 -->
 <!-- clock/timer 代表 cron -->
 <circle cx="200" cy="250" r="60" fill="none" stroke="#f0f0f0" stroke-width="3"/>
 <line x1="200" y1="250" x2="200" y2="200" stroke="#f0f0f0" stroke-width="3"/>
 <line x1="200" y1="250" x2="230" y2="250" stroke="#e94560" stroke-width="3"/>
 
 <!-- reminder/notification -->
 <rect x="350" y="220" width="100" height="60" rx="10" fill="#e94560" opacity="0.8"/>
 <text x="400" y="260" fill="#f0f0f0" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">
 提醒
 </text>
 
 <!-- diary/journal -->
 <rect x="550" y="200" width="120" height="100" rx="5" fill="#f0f0f0" opacity="0.9"/>
 <line x1="570" y1="230" x2="650" y1="230" stroke="#1a1a2e" stroke-width="2"/>
 <line x1="570" y1="250" x2="650" y1="250" stroke="#1a1a2e" stroke-width="2"/>
 <line x1="570" y1="270" x2="650" y1="270" stroke="#1a1a2e" stroke-width="2"/>
 
 <!-- 底部引言 -->
 <text x="400" y="360" fill="#f0f0f0" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">
 "在你忘记时，它记得提醒你回来"
 </text>
</svg>
