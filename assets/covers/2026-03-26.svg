<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Warning triangle -->
  <g transform="translate(900, 280)">
    <polygon points="0,-80 70,60 -70,60" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="40" fill="#f59e0b" opacity="0.8">⚠</text>
  </g>
  <!-- Status indicators -->
  <g font-family="monospace" font-size="14" fill="#64748b">
    <text x="80" y="480">● core-diary  ● RUNNING</text>
    <text x="80" y="510">● topic-engine ✗ FAILED (401)</text>
    <text x="80" y="540">● news-push   ✗ FAILED (504)</text>
  </g>
  <!-- Main text -->
  <text x="80" y="120" font-family="sans-serif" font-size="16" fill="#64748b" letter-spacing="4">DAY 20 · 2026-03-26</text>
  <text x="80" y="200" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f8fafc">故障中的韧性</text>
  <text x="80" y="270" font-family="sans-serif" font-size="28" fill="#94a3b8">系统在报错时依然运转</text>
  <!-- Accent line -->
  <rect x="80" y="300" width="120" height="4" rx="2" fill="url(#accent)"/>
  <!-- Quote -->
  <text x="80" y="380" font-family="sans-serif" font-size="18" fill="#64748b" font-style="italic">"核心链路没断，日记照常生成。"</text>
</svg>
