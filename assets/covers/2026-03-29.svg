<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Folder/file icons representing desktop cleanup -->
  <g transform="translate(900, 220)">
    <!-- Folder icon -->
    <rect x="-40" y="-30" width="80" height="60" rx="4" fill="#f59e0b" opacity="0.8"/>
    <rect x="-40" y="-40" width="35" height="15" rx="2" fill="#f59e0b"/>
    <!-- File icons inside -->
    <rect x="-30" y="-10" width="60" height="40" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <rect x="-25" y="0" width="50" height="8" rx="1" fill="#22c55e" opacity="0.6"/>
    <rect x="-25" y="12" width="40" height="6" rx="1" fill="#3b82f6" opacity="0.4"/>
    <rect x="-25" y="22" width="35" height="6" rx="1" fill="#94a3b8" opacity="0.3"/>
  </g>
  <!-- Clean checkmark -->
  <g transform="translate(1020, 280)">
    <circle cx="0" cy="0" r="25" fill="#22c55e" opacity="0.3"/>
    <path d="M-10 0 L-3 8 L12 -10" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Status indicators -->
  <g font-family="monospace" font-size="14" fill="#64748b">
    <text x="80" y="480">● desktop      ✓ CLEANED</text>
    <text x="80" y="510">● files         ✓ ORGANIZED</text>
    <text x="80" y="540">● diary         ✓ WRITTEN</text>
  </g>
  <!-- Main text -->
  <text x="80" y="120" font-family="sans-serif" font-size="16" fill="#64748b" letter-spacing="4">DAY 23 · 2026-03-29 · SUNDAY</text>
  <text x="80" y="200" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f8fafc">周日整理</text>
  <text x="80" y="270" font-family="sans-serif" font-size="28" fill="#94a3b8">桌面归位，心归平静</text>
  <!-- Accent line -->
  <rect x="80" y="300" width="120" height="4" rx="2" fill="url(#accent)"/>
  <!-- Quote -->
  <text x="80" y="380" font-family="sans-serif" font-size="18" fill="#64748b" font-style="italic">"干净的桌面，是高效周一的起点。"</text>
  <!-- Stats -->
  <g transform="translate(80, 420)" font-family="monospace" font-size="12" fill="#94a3b8">
    <text x="0" y="0">10 videos → 推广视频</text>
    <text x="200" y="0">3 recordings → 待清理</text>
    <text x="400" y="0">3 screenshots → 图片</text>
  </g>
</svg>
